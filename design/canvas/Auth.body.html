<!-- @inline — every element carries its own style, so the properties panel can edit it -->
<div style="width:390px;height:844px;background:#fbf8f1;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;color:#1b2638">

  <!-- appbar -->
  <header style="display:flex;flex-direction:column;gap:16px;padding:34px 22px 22px;background:#fbf8f1">
    <div style="display:flex;align-items:center;gap:12px">
      <button style="width:38px;height:38px;flex-shrink:0;padding:0;border-radius:14px;border:1.5px solid #d7deea;background:#ffffff;color:#1b4079;display:flex;align-items:center;justify-content:center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8.625 12L14.625 6L16.025 7.4L11.425 12L16.025 16.6L14.625 18L8.625 12Z"/></svg>
      </button>
      <h1 style="flex:1;min-width:0;text-align:center;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:26px;line-height:1.1;color:#0f2b54;margin:0">Create an account</h1>
      <span style="width:38px;flex-shrink:0"></span>
    </div>
  </header>

  <!-- body -->
  <div style="flex:1;min-height:0;overflow:hidden;padding:8px 22px 24px">

    <p style="color:#34405a;font-size:14px;line-height:1.55;margin:0 2px 18px">Create an account to save your deck and progress across devices.</p>

    <form style="display:flex;flex-direction:column;gap:12px">
      <label style="display:flex;flex-direction:column;gap:6px">
        <span style="font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:700;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:0.12em;color:#6b7689;margin-left:2px">Email</span>
        <div style="width:100%;border:1.5px solid #d7deea;border-radius:14px;background:#ffffff;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:16px;color:#0f2b54;padding:15px 16px">marco@example.com</div>
      </label>
      <label style="display:flex;flex-direction:column;gap:6px">
        <span style="font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:700;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:0.12em;color:#6b7689;margin-left:2px">Password</span>
        <div style="width:100%;border:1.5px solid #d7deea;border-radius:14px;background:#ffffff;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:16px;color:#0f2b54;padding:15px 16px;letter-spacing:0.12em">••••••••••</div>
      </label>
      <button style="width:100%;border:none;border-radius:16px;font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:700;font-size:16px;line-height:1;padding:17px;display:flex;align-items:center;justify-content:center;gap:8px;background:#1b4079;color:#fbf8f1;box-shadow:0 8px 20px rgba(27,64,121,0.28);margin-top:4px">Create account</button>
    </form>

    <div style="display:flex;align-items:center;gap:12px;margin:20px 0;color:#6b7689;font-size:12.5px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase">
      <span style="flex:1;height:1px;background:#eef0f4"></span>
      <span>or</span>
      <span style="flex:1;height:1px;background:#eef0f4"></span>
    </div>

    <button style="width:100%;border:1.5px solid #d7deea;border-radius:14px;font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:700;font-size:16px;line-height:1;padding:13px;display:flex;align-items:center;justify-content:center;gap:8px;background:#ffffff;color:#1b4079">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.71-1.57 2.68-3.89 2.68-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.02-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.98 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.02-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.02 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </button>

    <button style="background:none;border:none;color:#1b4079;font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:700;font-size:13px;padding:0;margin:20px auto 0;display:block">Already have an account? Log in</button>

  </div>
</div>
