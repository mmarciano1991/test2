<div class="phone">
  <div class="screen">
    <header class="appbar">
      <div class="appbar__row">
        <button class="icon-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8.625 12L14.625 6L16.025 7.4L11.425 12L16.025 16.6L14.625 18L8.625 12Z"/></svg></button>
        <h1 class="appbar__title title-serif">Create an account</h1>
        <span class="appbar__spacer"></span>
      </div>
    </header>

    <div class="screen__body gutter" style="padding-top:8px;padding-bottom:24px">
      <p class="muted" style="font-size:14px;line-height:1.55;margin:0 2px 18px">Create an account to save your deck and progress across devices.</p>

      <form style="display:flex;flex-direction:column;gap:12px">
        <label class="auth-field">
          <span class="auth-field__label">Email</span>
          <input class="text-input" type="email" value="marco@example.com" readonly>
        </label>
        <label class="auth-field">
          <span class="auth-field__label">Password</span>
          <input class="text-input" type="password" value="verysecret" readonly>
        </label>
        <button class="btn btn--primary" style="margin-top:4px">Create account</button>
      </form>

      <div class="auth-divider"><span>or</span></div>

      <button class="btn btn--secondary">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.71-1.57 2.68-3.89 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.02-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.98 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.02-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.02 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </button>

      <button class="link-btn" style="margin:20px auto 0;display:block">Already have an account? Log in</button>
    </div>
  </div>
</div>
