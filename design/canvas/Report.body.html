<div class="phone">
  <div class="screen pad-top">
    <div class="screen__body gutter" style="padding-top:22px;padding-bottom:8px">
      <div style="text-align:center">
        <span class="badge">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M9.55 18L3.85 12.3L5.275 10.875L9.55 15.15L18.725 5.975L20.15 7.4L9.55 18Z"/></svg>
          Batch of 8 done
        </span>
        <div style="font-family:var(--font-serif);font-size:30px;font-weight:600;color:var(--text-display);margin-top:14px">Goed bezig!</div>
        <p class="muted" style="font-size:14px;margin:7px 0 0">A quick check-in — not a grade.</p>
        <p style="font-size:13px;font-weight:700;color:var(--caution-solid);margin:9px 0 0">🔥 4-day streak — five minutes a day adds up.</p>
      </div>

      <div style="display:flex;gap:12px;margin-top:22px">
        <div class="stat-card"><div class="stat-card__value stat-card__value--success">6</div><div class="stat-card__label">Knew it</div></div>
        <div class="stat-card"><div class="stat-card__value stat-card__value--error">2</div><div class="stat-card__label">To review</div></div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin:18px 2px 11px">
        <span style="font-family:var(--font-serif);font-size:16px;font-weight:600;color:var(--text-display)">Words to review</span>
        <span class="faint" style="font-size:12.5px">Coming back sooner</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:9px">
        <div class="wordrow-compact">
          <span class="chip chip--het chip--sm">het</span>
          <span class="wordrow-compact__dutch">slot</span>
          <span class="wordrow-compact__gloss">lock</span>
          <span class="tricky-tag">Tricky</span>
        </div>
        <div class="wordrow-compact">
          <span class="chip chip--de chip--sm">de</span>
          <span class="wordrow-compact__dutch">huurder</span>
          <span class="wordrow-compact__gloss">tenant</span>
        </div>
      </div>
    </div>

    <div class="gutter" style="padding:12px 22px 32px;display:flex;flex-direction:column;gap:9px">
      <button class="btn btn--primary">Continue to next 6</button>
      <button class="btn btn--secondary">Review missed words</button>
      <button class="link-btn" style="margin:5px auto 0;display:block">Back to dashboard</button>
    </div>
  </div>
</div>
