<div class="phone">
  <div class="screen">
    <header class="appbar appbar--divider">
      <div class="appbar__row">
        <button class="icon-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8.625 12L14.625 6L16.025 7.4L11.425 12L16.025 16.6L14.625 18L8.625 12Z"/></svg></button>
        <h1 class="appbar__title title-serif">Add a word</h1>
        <span class="appbar__spacer"></span>
      </div>
      <form class="appbar__search appbar__search--active">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="2"/><path d="M14 14l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input value="sloten" readonly>
        <button type="button" class="appbar__clear"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6.4 19L5 17.6L10.6 12L5 6.4L6.4 5L12 10.6L17.6 5L19 6.4L13.4 12L19 17.6L17.6 19L12 13.4L6.4 19Z"/></svg></button>
      </form>
    </header>

    <div class="screen__body gutter" style="padding-top:16px;padding-bottom:16px">
      <div class="addword__block">
        <div class="eyebrow">Which word did you mean?</div>
        <div class="sense-list">
          <div class="sensecard">
            <div class="sensecard__head">
              <span class="chip chip--het chip--sm">het</span>
              <span class="sensecard__word">slot</span>
              <span class="sensecard__tag">Plural</span>
            </div>
            <div class="sensecard__gloss">lock</div>
            <div class="sensecard__example">
              <div class="quote">Het slot van de deur is kapot.</div>
              <div class="sensecard__example-en">The lock on the door is broken.</div>
            </div>
            <button class="btn btn--secondary sensecard__btn">Add this word</button>
          </div>
          <div class="sensecard">
            <div class="sensecard__head">
              <span class="chip chip--de chip--sm">de</span>
              <span class="sensecard__word">sloot</span>
              <span class="sensecard__tag">Plural</span>
            </div>
            <div class="sensecard__gloss">ditch</div>
            <div class="sensecard__example">
              <div class="quote">Pas op, je valt in de sloot.</div>
              <div class="sensecard__example-en">Watch out, you'll fall in the ditch.</div>
            </div>
            <button class="btn btn--secondary sensecard__btn">Add this word</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
