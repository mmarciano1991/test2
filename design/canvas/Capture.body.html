<!-- @inline — every element carries its own style, so the properties panel can edit it -->
<div style="width:390px;height:844px;background:#fbf8f1;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;color:#1b2638">

  <!-- appbar with search -->
  <header style="display:flex;flex-direction:column;gap:16px;padding:34px 22px 22px;background:#fbf8f1;border-bottom:1px solid #ede8db">
    <div style="display:flex;align-items:center;gap:12px">
      <button style="width:38px;height:38px;flex-shrink:0;padding:0;border-radius:14px;border:1.5px solid #d7deea;background:#ffffff;color:#1b4079;display:flex;align-items:center;justify-content:center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8.625 12L14.625 6L16.025 7.4L11.425 12L16.025 16.6L14.625 18L8.625 12Z"/></svg>
      </button>
      <h1 style="flex:1;min-width:0;text-align:center;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:26px;line-height:1.1;color:#0f2b54;margin:0">Add a word</h1>
      <span style="width:38px;flex-shrink:0"></span>
    </div>
    <form style="display:flex;align-items:center;gap:8px;background:#ffffff;border:1px solid #9db6d8;border-radius:16px;padding:12px 16px;box-shadow:0 2px 9px rgba(15,43,84,0.05)">
      <svg width="19" height="19" viewBox="0 0 20 20" fill="none" style="flex-shrink:0;color:#1b4079"><circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="2"/><path d="M14 14l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span style="flex:1;min-width:0;font-size:16px;line-height:1.55;color:#34405a">sloten</span>
      <button style="flex-shrink:0;display:flex;border:none;background:transparent;padding:0;color:#1b4079">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6.4 19L5 17.6L10.6 12L5 6.4L6.4 5L12 10.6L17.6 5L19 6.4L13.4 12L19 17.6L17.6 19L12 13.4L6.4 19Z"/></svg>
      </button>
    </form>
  </header>

  <!-- body — the two-candidate deinflection picker -->
  <div style="flex:1;min-height:0;overflow:hidden;padding:16px 22px">
    <div style="display:flex;flex-direction:column;gap:16px">

      <div style="font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:700;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:0.12em;color:#6b7689">Which word did you mean?</div>

      <div style="display:flex;flex-direction:column;gap:12px">

        <!-- candidate 1 -->
        <div style="background:#ffffff;border:1px solid #e4e9f2;border-radius:20px;padding:16px 18px;box-shadow:0 8px 22px rgba(15,43,84,0.07);display:flex;flex-direction:column;gap:6px">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="padding:4px 12px;border-radius:9px;font-weight:700;font-size:13px;background:#ffffff;color:#1b4079;box-shadow:inset 0 0 0 1.6px #1b4079">het</span>
            <span style="font-family:'Spectral',Georgia,serif;font-weight:600;font-size:20px;color:#0f2b54">slot</span>
            <span style="margin-left:auto;font-size:11px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:#6b7689;background:#eef3fa;padding:3px 8px;border-radius:999px;white-space:nowrap">Plural</span>
          </div>
          <div style="font-size:16px;color:#1b4079">lock</div>
          <div style="margin-top:2px">
            <div style="font-family:'Spectral',Georgia,serif;font-style:italic;font-size:16px;color:#34405a;line-height:1.5">Het slot van de deur is kapot.</div>
            <div style="font-size:14px;color:#6b7689;margin-top:2px">The lock on the door is broken.</div>
          </div>
          <button style="margin-top:6px;align-self:flex-start;border:1.5px solid #d7deea;border-radius:14px;font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:700;font-size:16px;line-height:1;padding:13px 18px;background:#ffffff;color:#1b4079">Add this word</button>
        </div>

        <!-- candidate 2 -->
        <div style="background:#ffffff;border:1px solid #e4e9f2;border-radius:20px;padding:16px 18px;box-shadow:0 8px 22px rgba(15,43,84,0.07);display:flex;flex-direction:column;gap:6px">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="padding:4px 12px;border-radius:9px;font-weight:700;font-size:13px;background:#1b4079;color:#ffffff">de</span>
            <span style="font-family:'Spectral',Georgia,serif;font-weight:600;font-size:20px;color:#0f2b54">sloot</span>
            <span style="margin-left:auto;font-size:11px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:#6b7689;background:#eef3fa;padding:3px 8px;border-radius:999px;white-space:nowrap">Plural</span>
          </div>
          <div style="font-size:16px;color:#1b4079">ditch</div>
          <div style="margin-top:2px">
            <div style="font-family:'Spectral',Georgia,serif;font-style:italic;font-size:16px;color:#34405a;line-height:1.5">Pas op, je valt in de sloot.</div>
            <div style="font-size:14px;color:#6b7689;margin-top:2px">Watch out, you&rsquo;ll fall in the ditch.</div>
          </div>
          <button style="margin-top:6px;align-self:flex-start;border:1.5px solid #d7deea;border-radius:14px;font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:700;font-size:16px;line-height:1;padding:13px 18px;background:#ffffff;color:#1b4079">Add this word</button>
        </div>

      </div>
    </div>
  </div>
</div>
