<!-- @inline — every element carries its own style, so the properties panel can edit it -->
<div style="width:390px;height:844px;background:#fbf8f1;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;color:#1b2638">

  <!-- appbar -->
  <header style="display:flex;flex-direction:column;gap:16px;padding:34px 22px 22px;background:#fbf8f1">
    <div style="display:flex;align-items:center;gap:12px">
      <button style="width:38px;height:38px;flex-shrink:0;padding:0;border-radius:14px;border:1.5px solid #d7deea;background:#ffffff;color:#1b4079;display:flex;align-items:center;justify-content:center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8.625 12L14.625 6L16.025 7.4L11.425 12L16.025 16.6L14.625 18L8.625 12Z"/></svg>
      </button>
      <h1 style="flex:1;min-width:0;text-align:center;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:26px;line-height:1.1;color:#0f2b54;margin:0">Check your email</h1>
      <span style="width:38px;flex-shrink:0"></span>
    </div>
  </header>

  <!-- body -->
  <div style="flex:1;min-height:0;overflow:hidden;padding:8px 22px 24px">

    <div style="border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:16px;font-weight:700;line-height:1.55;background:#e7f0ea;border:1px solid #c2dbcb;color:#2e5e40">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="width:24px;height:24px;flex-shrink:0"><path d="M10.6 16.6L17.65 9.55L16.25 8.15L10.6 13.8L7.75 10.95L6.35 12.35L10.6 16.6ZM12 22C10.6167 22 9.31667 21.7375 8.1 21.2125C6.88333 20.6875 5.825 19.975 4.925 19.075C4.025 18.175 3.3125 17.1167 2.7875 15.9C2.2625 14.6833 2 13.3833 2 12C2 10.6167 2.2625 9.31667 2.7875 8.1C3.3125 6.88333 4.025 5.825 4.925 4.925C5.825 4.025 6.88333 3.3125 8.1 2.7875C9.31667 2.2625 10.6167 2 12 2C13.3833 2 14.6833 2.2625 15.9 2.7875C17.1167 3.3125 18.175 4.025 19.075 4.925C19.975 5.825 20.6875 6.88333 21.2125 8.1C21.7375 9.31667 22 10.6167 22 12C22 13.3833 21.7375 14.6833 21.2125 15.9C20.6875 17.1167 19.975 18.175 19.075 19.075C18.175 19.975 17.1167 20.6875 15.9 21.2125C14.6833 21.7375 13.3833 22 12 22Z"/></svg>
      <span>We&rsquo;ve sent a code to marco@example.com. Enter it below to finish creating your account.</span>
    </div>

    <form style="margin-top:18px;display:flex;flex-direction:column;gap:12px">
      <label style="display:flex;flex-direction:column;gap:6px">
        <span style="font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:700;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:0.12em;color:#6b7689;margin-left:2px">Confirmation code</span>
        <div style="width:100%;border:1.5px solid #1b4079;border-radius:14px;background:#ffffff;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:16px;color:#0f2b54;padding:15px 16px;letter-spacing:0.22em">482051</div>
      </label>
      <button style="width:100%;border:none;border-radius:16px;font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:700;font-size:16px;line-height:1;padding:17px;display:flex;align-items:center;justify-content:center;gap:8px;background:#1b4079;color:#fbf8f1;box-shadow:0 8px 20px rgba(27,64,121,0.28)">Verify and continue</button>
    </form>

    <p style="color:#34405a;font-size:14px;line-height:1.55;margin:18px 2px">Got a link instead of a code? Opening it confirms your account the same way — come back here and log in afterward. Nothing after a minute or two? Check your spam folder, or send it again.</p>

    <button style="width:100%;border:1.5px solid #d7deea;border-radius:14px;font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:700;font-size:16px;line-height:1;padding:13px;display:flex;align-items:center;justify-content:center;gap:8px;background:#ffffff;color:#1b4079">Send it again</button>

    <button style="background:none;border:none;color:#1b4079;font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:700;font-size:13px;padding:0;margin:22px auto 0;display:block">Back to log in</button>

  </div>
</div>
