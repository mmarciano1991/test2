<div class="phone">
  <div class="screen">

      <div class="appbar__row">
        <button class="icon-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8.625 12L14.625 6L16.025 7.4L11.425 12L16.025 16.6L14.625 18L8.625 12Z"/></svg></button>

        <svg class="notice__icon" viewBox="0 0 24 24" fill="currentColor"><path d="M10.6 16.6L17.65 9.55L16.25 8.15L10.6 13.8L7.75 10.95L6.35 12.35L10.6 16.6ZM12 22C10.6167 22 9.31667 21.7375 8.1 21.2125C6.88333 20.6875 5.825 19.975 4.925 19.075C4.025 18.175 3.3125 17.1167 2.7875 15.9C2.2625 14.6833 2 13.3833 2 12C2 10.6167 2.2625 9.31667 2.7875 8.1C3.3125 6.88333 4.025 5.825 4.925 4.925C5.825 4.025 6.88333 3.3125 8.1 2.7875C9.31667 2.2625 10.6167 2 12 2C13.3833 2 14.6833 2.2625 15.9 2.7875C17.1167 3.3125 18.175 4.025 19.075 4.925C19.975 5.825 20.6875 6.88333 21.2125 8.1C21.7375 9.31667 22 10.6167 22 12C22 13.3833 21.7375 14.6833 21.2125 15.9C20.6875 17.1167 19.975 18.175 19.075 19.075C18.175 19.975 17.1167 20.6875 15.9 21.2125C14.6833 21.7375 13.3833 22 12 22Z"/></svg>
        <span>We&rsquo;ve sent a code to marco@example.com. Enter it below to finish creating your account.</span>
      </div>

      <form style="margin-top:18px;display:flex;flex-direction:column;gap:12px">
        <label class="auth-field">
          <span class="auth-field__label">Confirmation code</span>
          <input class="text-input" value="482051" readonly>
        </label>
        <button class="btn btn--primary">Verify and continue</button>
      </form>

      <p class="muted" style="font-size:14px;line-height:1.55;margin:18px 2px">Got a link instead of a code? Opening it confirms your account the same way — come back here and log in afterward. Nothing after a minute or two? Check your spam folder, or send it again.</p>
      <button class="btn btn--secondary">Send it again</button>

      <button class="link-btn" style="margin:22px auto 0;display:block">Back to log in</button>
    </div>
  </div>
</div>
