<!-- @inline — every element carries its own style, so the properties panel can edit it -->
<div style="width:390px;height:844px;background:#fbf8f1;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;color:#1b2638">

  <div style="flex:1;min-height:0;display:flex;flex-direction:column;padding-top:54px">

    <!-- wordmark + title -->
    <div style="padding:4px 22px 14px">
      <div style="display:flex;align-items:center;gap:7px">
        <svg width="17" height="20" viewBox="0 0 22 26" fill="none">
          <path d="M11 25 V13" stroke="#1b4079" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M11 13 C5 13 3 5 5 1 C7 5 9 6 11 5 C13 6 15 5 17 1 C19 5 17 13 11 13Z" fill="#2e5ea8"/>
          <path d="M11 22 C6 21 3 17 3 12 C8 13 10 17 11 22Z" fill="#6e92c4"/>
        </svg>
        <span style="font-family:'Spectral',Georgia,serif;font-weight:600;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:#1b4079">Woordkast</span>
      </div>
      <h1 style="font-family:'Spectral',Georgia,serif;font-weight:600;font-size:20px;color:#0f2b54;margin:7px 0 0">Settings</h1>
    </div>

    <div style="flex:1;min-height:0;overflow:hidden;padding:0 22px 26px">

      <!-- account -->
      <div style="background:#ffffff;border:1px solid #ede8db;border-radius:20px;box-shadow:0 8px 22px rgba(15,43,84,0.07);padding:20px;margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:12px">
          <span style="width:40px;height:40px;flex-shrink:0;border-radius:50%;background:#1b4079;color:#ffffff;display:flex;align-items:center;justify-content:center;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:18px">M</span>
          <div style="min-width:0">
            <div style="font-weight:700;font-size:14px;color:#1b2638">marco@example.com</div>
            <div style="font-size:12.5px;color:#6b7689">Progress syncs to your account</div>
          </div>
        </div>
        <button style="width:100%;border:1.5px solid #d7deea;border-radius:14px;font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:700;font-size:16px;line-height:1;padding:13px;display:flex;align-items:center;justify-content:center;gap:8px;background:#ffffff;color:#1b4079;margin-top:16px">Log out</button>
      </div>

      <!-- counts -->
      <div style="background:#ffffff;border:1px solid #ede8db;border-radius:20px;box-shadow:0 8px 22px rgba(15,43,84,0.07);padding:20px">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:14px;color:#34405a">Words in the dictionary</span>
          <span style="font-family:'Spectral',Georgia,serif;font-weight:600;color:#0f2b54">14,193</span>
        </div>
        <div style="height:1px;background:#eef0f4;margin:12px 0"></div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:14px;color:#34405a">Words in your deck</span>
          <span style="font-family:'Spectral',Georgia,serif;font-weight:600;color:#0f2b54">34</span>
        </div>
      </div>

      <p style="font-size:12px;line-height:1.5;color:#6b7689;margin-top:18px;text-align:center">Woordkast · Dutch words, kept like fine china.</p>

    </div>
  </div>

  <!-- bottom navigation — the FAB is collapsed here, adding a word is moot -->
  <div style="display:flex;align-items:center;padding:22px">
    <nav style="flex:1;min-width:0;display:flex;align-items:center;gap:16px;background:#ffffff;border:1px solid #e4e9f2;border-radius:999px;box-shadow:0 8px 22px rgba(15,43,84,0.07);padding:8px 26px">

      </button>

  </div>

</div>
