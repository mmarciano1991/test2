<!-- @inline — every element carries its own style, so the properties panel can edit it -->
<div style="width:390px;height:844px;background:#fbf8f1;display:flex;flex-direction:column;overflow:hidden;font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;color:#1b2638">

  <!-- appbar with search -->
  <header style="display:flex;flex-direction:column;gap:16px;padding:34px 22px 22px;background:#fbf8f1">
    <div style="display:flex;align-items:center;gap:12px">
      <h1 style="flex:1;min-width:0;text-align:center;font-family:'Spectral',Georgia,serif;font-weight:600;font-size:26px;line-height:1.1;color:#0f2b54;margin:0">Your deck</h1>
    </div>
    <form style="display:flex;align-items:center;gap:8px;background:#ffffff;border:1px solid #e4e9f2;border-radius:16px;padding:12px 16px;box-shadow:0 2px 9px rgba(15,43,84,0.05)">
      <svg width="19" height="19" viewBox="0 0 20 20" fill="none" style="flex-shrink:0;color:#1b4079"><circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="2"/><path d="M14 14l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span style="flex:1;min-width:0;font-size:16px;line-height:1.55;color:#6b7689">Search Dutch or English…</span>
    </form>
  </header>

  <!-- deck list -->
  <div style="flex:1;min-height:0;overflow:hidden;padding:14px 22px 20px">
    <div style="display:flex;flex-direction:column;gap:10px">

      <!-- open row, with a captured source sentence -->
      <div style="width:100%;text-align:left;background:#ffffff;border:1px solid #ede8db;border-radius:16px;padding:13px 16px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:center;gap:22px">
          <div style="flex:1;min-width:0;display:flex;align-items:center">
            <button style="width:38px;height:38px;flex-shrink:0;padding:0;border-radius:14px;border:1.5px solid transparent;background:none;color:#1b4079;display:flex;align-items:center;justify-content:center">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="transform:rotate(180deg)"><path d="M12 15.375L6 9.375L7.4 7.975L12 12.575L16.6 7.975L18 9.375L12 15.375Z"/></svg>
            </button>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:8px">
              <span style="display:flex;flex-direction:column;align-items:flex-start;gap:4px;max-width:100%">
                <span style="padding:4px 12px;border-radius:9px;font-weight:700;font-size:13px;background:#1b4079;color:#ffffff">de</span>
                <span style="font-family:'Spectral',Georgia,serif;font-size:18px;font-weight:600;line-height:1.15;color:#0f2b54">hond</span>
              </span>
              <span style="font-size:14px;color:#6b7689">dog</span>
            </div>
          </div>
          <span style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px">
            <span style="display:inline-block;width:32px;height:8px;border-radius:9px;overflow:hidden;background:#e7f0ea">
              <span style="display:block;height:100%;width:100%;border-radius:9px;background:#3e7a57"></span>
            </span>
            <span style="font-size:12px;font-weight:700;letter-spacing:0.12em;color:#1b2638">Mature</span>
          </span>
          <button style="width:38px;height:38px;flex-shrink:0;padding:0;border-radius:14px;border:1.5px solid #d7deea;background:#ffffff;color:#1b4079;display:flex;align-items:center;justify-content:center">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M5 13V11H19V13H5Z"/></svg>
          </button>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px">
          <div style="align-self:stretch;height:1px;background:#e4e9f2"></div>
          <div>
            <div style="font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:700;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:0.12em;color:#6b7689">Where you met it</div>
            <div style="font-family:'Spectral',Georgia,serif;font-style:italic;font-size:16px;line-height:1.5;color:#34405a;margin-top:4px">De hond loopt in de tuin.</div>
          </div>
          <div style="font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:700;font-size:12px;line-height:1;text-transform:uppercase;letter-spacing:0.12em;color:#6b7689">In context</div>
          <div style="display:flex;flex-direction:column;gap:4px">
            <div style="font-family:'Spectral',Georgia,serif;font-style:italic;font-size:16px;line-height:1.5;color:#34405a">De hond rent door het park.</div>
            <div style="font-size:16px;line-height:1.55;color:#34405a">The dog runs through the park.</div>
          </div>
          <button style="background:none;border:none;color:#1b4079;font-weight:700;font-size:13px;padding:0;align-self:flex-start">Edit translation</button>
        </div>
      </div>

      <!-- closed row -->
      <div style="width:100%;background:#ffffff;border:1px solid #ede8db;border-radius:16px;padding:13px 16px;display:flex;align-items:center;gap:22px">
        <div style="flex:1;min-width:0;display:flex;align-items:center">
          <button style="width:38px;height:38px;flex-shrink:0;padding:0;border-radius:14px;border:1.5px solid transparent;background:none;color:#1b4079;display:flex;align-items:center;justify-content:center">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15.375L6 9.375L7.4 7.975L12 12.575L16.6 7.975L18 9.375L12 15.375Z"/></svg>
          </button>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:8px">
            <span style="display:flex;flex-direction:column;align-items:flex-start;gap:4px;max-width:100%">
              <span style="padding:4px 12px;border-radius:9px;font-weight:700;font-size:13px;background:#1b4079;color:#ffffff">de</span>
              <span style="font-family:'Spectral',Georgia,serif;font-size:18px;font-weight:600;line-height:1.15;color:#0f2b54">afspraak</span>
            </span>
            <span style="font-size:14px;color:#6b7689">appointment / agreement</span>
          </div>
        </div>
        <span style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px">
          <span style="display:inline-block;width:32px;height:8px;border-radius:9px;overflow:hidden;background:#fbf1dd">
            <span style="display:block;height:100%;width:33%;border-radius:9px;background:#c99a2e"></span>
          </span>
          <span style="font-size:12px;font-weight:700;letter-spacing:0.12em;color:#1b2638">Learning</span>
        </span>
        <button style="width:38px;height:38px;flex-shrink:0;padding:0;border-radius:14px;border:1.5px solid #d7deea;background:#ffffff;color:#1b4079;display:flex;align-items:center;justify-content:center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M5 13V11H19V13H5Z"/></svg>
        </button>
      </div>

      <!-- closed row, flagged tricky -->
      <div style="width:100%;background:#ffffff;border:1px solid #ede8db;border-radius:16px;padding:13px 16px;display:flex;align-items:center;gap:22px">
        <div style="flex:1;min-width:0;display:flex;align-items:center">
          <button style="width:38px;height:38px;flex-shrink:0;padding:0;border-radius:14px;border:1.5px solid transparent;background:none;color:#1b4079;display:flex;align-items:center;justify-content:center">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15.375L6 9.375L7.4 7.975L12 12.575L16.6 7.975L18 9.375L12 15.375Z"/></svg>
          </button>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:8px">
            <span style="display:flex;flex-direction:column;align-items:flex-start;gap:4px;max-width:100%">
              <span style="padding:4px 12px;border-radius:9px;font-weight:700;font-size:13px;background:#ffffff;color:#1b4079;box-shadow:inset 0 0 0 1.6px #1b4079">het</span>
              <span style="font-family:'Spectral',Georgia,serif;font-size:18px;font-weight:600;line-height:1.15;color:#0f2b54">slot</span>
              <span style="flex-shrink:0;padding:3px 8px;border-radius:999px;background:#fbf1dd;border:1px solid #e9d5a6;color:#8a6a1e;font-size:10.5px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase">Tricky</span>
            </span>
            <span style="font-size:14px;color:#6b7689">lock</span>
          </div>
        </div>
        <span style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px">
          <span style="display:inline-block;width:32px;height:8px;border-radius:9px;overflow:hidden;background:#a9b0be">
            <span style="display:block;height:100%;width:17%;border-radius:9px;background:#5a6b86"></span>
          </span>
          <span style="font-size:12px;font-weight:700;letter-spacing:0.12em;color:#1b2638">New</span>
        </span>
        <button style="width:38px;height:38px;flex-shrink:0;padding:0;border-radius:14px;border:1.5px solid #d7deea;background:#ffffff;color:#1b4079;display:flex;align-items:center;justify-content:center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M5 13V11H19V13H5Z"/></svg>
        </button>
      </div>

    </div>
  </div>

  <!-- bottom navigation -->
  <div style="display:flex;align-items:center;padding:22px">
    <nav style="flex:1;min-width:0;display:flex;align-items:center;gap:16px;background:#ffffff;border:1px solid #e4e9f2;border-radius:999px;box-shadow:0 8px 22px rgba(15,43,84,0.07);padding:8px 26px">
      <button style="flex:1;min-width:56px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:#a9b0be;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:12px;font-weight:700;letter-spacing:0.12em">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M4 21V9L12 3L20 9V21H14V14H10V21H4Z"/></svg><span>Home</span>
      </button>
      <button style="flex:1;min-width:56px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:#1b4079;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:12px;font-weight:700;letter-spacing:0.12em">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6.75 22C6 22 5.35417 21.7458 4.8125 21.2375C4.27083 20.7292 4 20.1 4 19.35V5.4C4 4.76667 4.19583 4.2 4.5875 3.7C4.97917 3.2 5.49167 2.88334 6.125 2.75L16 0.800003V16.8L6.525 18.7C6.375 18.7333 6.25 18.8125 6.15 18.9375C6.05 19.0625 6 19.2 6 19.35C6 19.5333 6.075 19.6875 6.225 19.8125C6.375 19.9375 6.55 20 6.75 20H18V4H20V22H6.75ZM7 16.575L9 16.175V4.225L7 4.625V16.575Z"/></svg><span>Deck</span>
      </button>
      <button style="flex:1;min-width:56px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:#a9b0be;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:12px;font-weight:700;letter-spacing:0.12em">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M17.15 20.7L11.1 14.6C10.7667 14.7333 10.4292 14.8333 10.0875 14.9C9.74583 14.9667 9.38333 15 9 15C7.33333 15 5.91667 14.4167 4.75 13.25C3.58333 12.0833 3 10.6667 3 9C3 8.4 3.08333 7.82917 3.25 7.2875C3.41667 6.74583 3.65 6.23333 3.95 5.75L7.6 9.4L9.4 7.6L5.75 3.95C6.23333 3.65 6.74583 3.41667 7.2875 3.25C7.82917 3.08333 8.4 3 9 3C10.6667 3 12.0833 3.58333 13.25 4.75C14.4167 5.91667 15 7.33333 15 9C15 9.38333 14.9667 9.74583 14.9 10.0875C14.8333 10.4292 14.7333 10.7667 14.6 11.1L20.7 17.15C20.9 17.35 21 17.5917 21 17.875C21 18.1583 20.9 18.4 20.7 18.6L18.6 20.7C18.4 20.9 18.1583 21 17.875 21C17.5917 21 17.35 20.9 17.15 20.7Z"/></svg><span>Settings</span>
      </button>
    </nav>
    <button style="flex-shrink:0;width:60px;height:60px;padding:0;margin-left:8px;border-radius:50%;background:#1b4079;color:#fbf8f1;border:none;box-shadow:0 12px 26px rgba(27,64,121,0.36);display:flex;align-items:center;justify-content:center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M11 13H5V11H11V5H13V11H19V13H13V19H11V13Z"/></svg>
    </button>
  </div>

</div>
