<div class="phone">
  <div class="screen pad-top">
    <div class="topbar">
      <button class="icon-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6.4 19L5 17.6L10.6 12L5 6.4L6.4 5L12 10.6L17.6 5L19 6.4L13.4 12L19 17.6L17.6 19L12 13.4L6.4 19Z"/></svg></button>
      <div class="progress"><div class="progress__fill" style="width:37.5%"></div></div>
      <span style="font-size:13px;font-weight:700;color:var(--text-muted)">3/8</span>
    </div>

    <div class="screen__body gutter" style="padding:14px 22px 4px;display:flex;flex-direction:column">
      <div class="eyebrow" style="text-align:center">Do you know this word?</div>

      <div class="flashcard">
        <div class="flashcard__inner">
          <div class="flashcard__face flashcard__face--front">
            <span class="chip chip--de">de</span>
            <div class="flashcard__word">hond</div>
            <div class="divider-rule"></div>
            <div class="flashcard__example">De hond rent door het park.</div>
            <div class="divider-rule"></div>
            <div class="flashcard__met-in">
              <div class="flashcard__met-in-label">Where you met it</div>
              <div class="flashcard__example">De hond loopt in de tuin.</div>
            </div>
            <div class="flashcard__hint">Tap to flip</div>
          </div>
        </div>
      </div>
    </div>

    <div class="gutter" style="padding:12px 22px 32px;display:flex;gap:12px">
      <button class="btn btn--primary">Show translation</button>
    </div>
  </div>
</div>
